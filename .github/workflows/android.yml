name: Build Android assistant APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'E.L.V.A.R. のデプロイ先URL（空ならリポジトリ変数 ELVAR_URL、それも空ならアプリが初回に聞く）'
        required: false
  push:
    paths: ['android/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug "-PelvarUrl=${{ inputs.url || vars.ELVAR_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: elvar-assistant-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
