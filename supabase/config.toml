# Supabase CLI project configuration (docs/ELVAR_MULTIUSER.md section 5). Used by `supabase start` for local development with the real Supabase stack;
# the automated database tests (npm run test:db) run on plain Postgres and do not need it. Not validated against the CLI in the P1 build environment.
project_id = "elvar"

[api]
enabled = true
port = 54321
# The Data API (PostgREST) serves public and graphql_public ONLY. Every user table lives in the private schema `app`, so a browser holding the
# publishable key and its own JWT cannot reach any table: all data access goes through the server (as the elvar_app role). Do not add "app" here.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "com.elvar.mark1://auth-callback", "elvar://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

# The sign-up policy (app.platform_config: signup_mode, daily_signup_limit, ip_daily_signup_limit, blocked e-mail domains, invites) is enforced HERE, for e-mail and
# Google sign-ups alike. A hosted project does not read this file: enable the same hook in the dashboard (supabase/README.md, "Auth hook").
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/app/before_user_created"


# The file vault (P5, docs/ELVAR_MULTIUSER.md 3.3): one PRIVATE bucket, 60 MB per object (O1). Object names are users/<uid>/files/<fileId>/<sha256>; the policies
# (owner-only read / delete, a write needs a live upload reservation, no update) are in migration 20261110000007_files.sql, which also creates the bucket, so a plain
# `db reset` or a hosted project needs nothing here. Keep this block and the migration in step (a test compares the limit).
[storage]
enabled = true
file_size_limit = "60MiB"

[storage.buckets.user-files]
public = false
file_size_limit = "60MiB"

[storage.buckets.user-exports]
public = false
file_size_limit = "512MiB"
